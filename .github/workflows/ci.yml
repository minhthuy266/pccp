name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            review-app/package-lock.json
      - name: Install repository dependencies
        run: npm ci
      - name: Test repository content
        run: npm test
      - name: Install review app dependencies
        working-directory: review-app
        run: npm ci
      - name: Test review app
        working-directory: review-app
        run: npm test
      - name: Typecheck and build review app
        working-directory: review-app
        run: npm run build
